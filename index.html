<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontrol Mingguan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#e9edf3; --line:#d3dae4; --fg:#18222e; --muted:#5b6878;
  --accent:#1f5f8b; --accent-fg:#ffffff; --accent-soft:#dbe9f3;
  --ok:#2c7a4b; --ok-soft:#dcefe3; --warn:#a8690a; --warn-soft:#f8ecd2; --crit:#b3362b; --crit-soft:#f8dedb; --idle:#b9c3d0;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#11161d; --surface:#19212b; --surface2:#222c38; --line:#334050; --fg:#e6ebf2; --muted:#97a4b5;
  --accent:#6fb1dc; --accent-fg:#0d1720; --accent-soft:#1f3546;
  --ok:#62c088; --ok-soft:#1b3527; --warn:#e2ab4d; --warn-soft:#3a2e15; --crit:#ee7d72; --crit-soft:#40211e; --idle:#4a5868;
  color-scheme:dark } }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:16px;padding-right:16px}
header{position:sticky;top:0;z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
h1{font-family:var(--display);font-size:18px;font-weight:600;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted)}
h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab[aria-selected="true"],.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tab .n{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:600}
.discbar{border-top:1px solid var(--line);background:var(--surface)}
.discbar .wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:8px}
.discbar .lab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:4px}
main.wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.panel-h p{margin:0;color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--body);fill:var(--muted);font-size:10px}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:8px 12px;border-radius:6px;border:1px solid var(--line)}
.alert.crit{background:var(--crit-soft);border-color:var(--crit)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.ok{background:var(--ok-soft);border-color:var(--ok)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;min-width:90px}
.bar span{display:block;height:100%;background:var(--ok)}
.weeknav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.weeknav h2{font-size:20px}
select,input{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
.spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.grp{font-family:var(--display);font-weight:600;font-size:13px;padding:10px 0 4px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row .id{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.row .nm{min-width:0}
.row .nm b{font-weight:500}
.row .nm small{display:block;color:var(--muted);font-size:12px}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px;align-items:center;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts button{padding:5px 10px;font-size:13px}
.b-ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.b-miss[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.b-flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.row.s-ok{opacity:.72}
.empty{color:var(--muted);padding:14px 0}
.ind{display:grid;grid-template-columns:minmax(0,1.6fr) 96px 150px 150px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label input,label select{width:100%;color:var(--fg)}
details summary{cursor:pointer;font-weight:600}
.cand{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.cand span{min-width:0}
.note{font-size:12px;color:var(--muted);margin:0;max-width:80ch}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.form .wide{grid-column:1/-1}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:12px}
.vol{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:5px;font-size:12px;color:var(--muted)}
.vol label{flex-direction:row;align-items:center;gap:5px}
.vol input{width:84px;padding:2px 6px}
.vol input[data-volu]{width:60px}
.vol b{color:var(--fg)}
#q{flex:1 1 220px;max-width:360px;min-width:0}
.row.flash{background:var(--warn-soft);border-radius:6px}
@media (prefers-reduced-motion:no-preference){.row.flash{transition:background 2s}}
.print-only{display:none}
th.plan-c,td.plan-c{background:var(--ok-soft)!important}
.en{font-weight:400;opacity:.75}
.up{color:var(--ok);font-weight:600;white-space:nowrap}
h3{font-family:var(--display);font-size:14px;font-weight:600;margin:14px 0 0}
.btnrow label{min-width:200px}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#eceff3;--line:#c9d0da;--fg:#111;--muted:#444;--accent:#1f5f8b;--accent-fg:#fff;--accent-soft:#dbe9f3;
    --ok:#2c7a4b;--ok-soft:#dcefe3;--warn:#a8690a;--warn-soft:#f8ecd2;--crit:#b3362b;--crit-soft:#f8dedb;--idle:#b9c3d0;color-scheme:light}
  .print-only{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,.no-print,main>section[hidden]{display:none!important}
  @page{size:A4 landscape;margin:10mm}
  body{font-size:11px} main.wrap{display:block;max-width:none;padding:0}
  .panel{display:block;border:none;padding:0} .scroll{overflow:visible!important;max-height:none!important}
  .tgp{font-size:8.5px;table-layout:auto} .tgp th,.tgp td{padding:2px 4px} .tgp th{font-size:7.5px;letter-spacing:0} .tgb td{font-weight:600;background:var(--surface2)} svg{max-width:100%;height:auto}
  tr,.kpi{break-inside:avoid} h3{break-after:avoid} thead{display:table-header-group}
  th,td{padding:4px 6px}
}
@media (max-width:760px){
  .row{grid-template-columns:40px minmax(0,1fr)} .acts{grid-column:1/-1;justify-content:flex-start}
  .ind{grid-template-columns:1fr 1fr} .ind .wide{grid-column:1/-1}
  .tabs{margin-left:0}
}
</style>

<body>
<header>
  <div class="wrap">
    <h1><span id="h-title">Kontrol Mingguan</span><small id="h-sub"></small></h1>
    <input id="q" type="search" placeholder="Cari task: nama, ID, area, atau W12" aria-label="Cari task" autocomplete="off">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-dash" data-view="dash">Dashboard</button>
      <button class="tab" role="tab" id="tab-week" data-view="week">Kontrol Mingguan</button>
      <button class="tab" role="tab" id="tab-la" data-view="la">Lookahead</button>
      <button class="tab" role="tab" id="tab-pg" data-view="pg">Progress</button>
      <button class="tab" role="tab" id="tab-tg" data-view="tg">Target</button>

      <button class="tab" role="tab" id="tab-rep" data-view="rep">Laporan</button>

</header>
<main class="wrap">
  <section id="v-dash"></section>
  <section id="v-week" hidden></section>
  <section id="v-ind" hidden></section>
  <section id="v-la" hidden></section>
  <section id="v-pg" hidden></section>
  <section id="v-tg" hidden></section>
  <section id="v-cari" hidden></section>
  <section id="v-rep" hidden></section>
  <section id="v-set" hidden></section>
</main>
<input type="file" id="f-csv" accept=".csv,text/csv" hidden>
<input type="file" id="f-xlsx" accept=".xlsx,.xlsm,.xls" hidden>
<input type="file" id="f-json" accept=".json,application/json" hidden>

<script>
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,aug:8,agt:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
const dn=(y,m,d)=>Math.floor(Date.UTC(y,m-1,d)/864e5);
const n2d=n=>new Date(n*864e5);
const fmt=n=>{const d=n2d(n);return String(d.getUTCDate()).padStart(2,'0')+' '+BLN[d.getUTCMonth()]+" '"+String(d.getUTCFullYear()).slice(2)};
const n2iso=n=>n2d(n).toISOString().slice(0,10);
const wl=w=>'W'+String(w).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const $=id=>document.getElementById(id);
const now=new Date(), TODAY=dn(now.getFullYear(),now.getMonth()+1,now.getDate());

function parseDate(s){
  s=String(s||'').trim(); if(!s)return null; let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return dn(+m[1],+m[2],+m[3]);
  if(m=s.match(/^(\d{1,2})[-\/ .](\d{1,2})[-\/ .](\d{2,4})$/)){const y=+m[3]<100?2000+ +m[3]:+m[3];return dn(y,+m[2],+m[1])}
  if(m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[A-Za-z]*[-\/ ,']+(\d{2,4})$/)){const mo=MON[m[2].toLowerCase()];if(!mo)return null;const y=+m[3]<100?2000+ +m[3]:+m[3];return dn(y,mo,+m[1])}
  if(m=s.match(/^([A-Za-z]{3})[A-Za-z]* (\d{1,2}),? '?(\d{2,4})$/)){const mo=MON[m[1].toLowerCase()];if(!mo)return null;const y=+m[3]<100?2000+ +m[3]:+m[3];return dn(y,mo,+m[2])}
  return null;
}
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else if(c==='"')q=true; else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur=''; rows.push(row);row=[] }
    else cur+=c }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
const ALIAS={id:['id'],disc:['disiplin','discipline','disciplin'],area:['area','gedung','lokasi','zona'],grp:['kelompok','kelompok pekerjaan','group','wbs','sub pekerjaan'],
  name:['pekerjaan','task','task name','nama pekerjaan','uraian','uraian pekerjaan','item'],dur:['durasi','durasi (hari)','duration','hari'],start:['mulai','start','tanggal mulai'],end:['selesai','finish','end','tanggal selesai'],vol:['volume','vol','qty','kuantitas'],unit:['satuan','unit','sat'],bobot:['bobot','bobot (%)','weight']};
function num(s){s=String(s==null?'':s).replace(/[\s%]/g,'');if(!s)return null;if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else s=s.replace(',','.');const v=parseFloat(s);return isNaN(v)?null:v}
const nf=v=>(Math.round(v*100)/100).toLocaleString('id-ID');
function rowsFromCSV(text){
  const g=parseCSV(text.replace(/^﻿/,'')); let hi=-1,col={};
  for(let i=0;i<Math.min(g.length,15)&&hi<0;i++){const c={};
    g[i].forEach((h,j)=>{const k=String(h).trim().toLowerCase(); for(const f in ALIAS)if(!(f in c)&&ALIAS[f].includes(k))c[f]=j});
    if('name' in c&&'start' in c){hi=i;col=c}}
  if(hi<0){const f=(g.find(r=>r.some(c=>String(c).trim()))||[]).map(c=>String(c).trim()).filter(Boolean).slice(0,10);
    throw new Error('Kolom "Pekerjaan" dan "Mulai" tidak ditemukan di tab yang dibaca. Judul yang terbaca: '+(f.length?f.join(' | '):'(kosong)')+'. Buka tab daftar pekerjaan (Master) di Google Sheet, lalu salin link dari address bar saat tab itu aktif.')}
  const out=[];let skip=0;
  for(let i=hi+1;i<g.length;i++){const r=g[i],get=f=>f in col?String(r[col[f]]==null?'':r[col[f]]).trim():'';
    const name=get('name'); if(!name&&!get('start'))continue;
    const s=parseDate(get('start')); if(!name||s==null){skip++;continue}
    let dur=parseInt(get('dur'),10); const e=parseDate(get('end'));
    if(isNaN(dur))dur=e!=null?Math.max(e-s+1,0):1;
    out.push({id:get('id')||String(out.length+1),disc:'disc' in col?normDisc(get('disc')):guessDisc(get('grp'),get('area'),name),area:get('area')||'Umum',grp:get('grp'),name,s,dur,vol:num(get('vol')),unit:get('unit'),bobot:num(get('bobot'))});
  }
  if(!out.length)throw new Error('Tidak ada baris pekerjaan yang terbaca.');
  return {rows:out,skip};
}
function normDisc(s){
  s=String(s||'');
  if(/mep|elek|elec|listrik|mekanik|mechan|hvac|plumb|fire|t&c|commission|dismantle/i.test(s))return 'MEP';
  if(/csa|str|sipil|civil|ars|arch|persiapan|prelim/i.test(s))return 'CSA';
  return 'Umum';
}
function guessDisc(grp,area,name){
  if(/\bCSA\b/i.test(grp))return 'CSA';
  if(/mep|ele.?ctri|elektri|listrik|mechani|mekani|fire protection|plumbing|lighting|hvac/i.test(grp+' '+name))return 'MEP';
  if(/dismantle|bongkar|test|commis/i.test(area))return 'MEP';
  if(/milestone|punch|dokumen/i.test(area))return 'Umum';
  return 'CSA';
}
async function getCsv(u){
  const res=await fetch(u); const text=await res.text();
  if(!res.ok||/^\s*</.test(text))throw new Error('Sheet tidak bisa dibaca. Pastikan dibagikan ke "Siapa saja yang memiliki link" sebagai Pelihat.');
  return text;
}
/* Workbook mapping mingguan: tab Ringkasan berisi daftar nama tab per minggu, tiap tab berjudul kolom di baris 5. */
async function loadMapping(id){
  const base='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&headers=1';
  const names=parseCSV(await getCsv(base+'&range=B4:B200')).map(r=>String(r[0]||'').trim());
  if(names[0]!=='Sheet')return null;
  const tabs=names.slice(1).filter(Boolean); if(!tabs.length)return null;
  const parts=await Promise.all(tabs.map(n=>getCsv(base+'&range=A5:H&sheet='+encodeURIComponent(n)).then(rowsFromCSV).catch(()=>({rows:[]}))));
  const seen={},rows=[];
  for(const p of parts)for(const r of p.rows)if(!seen[r.id]){seen[r.id]=1;rows.push(r)}
  if(!rows.length)return null;
  rows.sort((a,b)=>(+a.id||0)-(+b.id||0));
  return {rows,skip:0,tabs:tabs.length};
}
function sheetCsvUrl(link){
  link=link.trim(); if(/\/pub\?/.test(link)&&/output=csv/.test(link))return link;
  const m=link.match(/\/spreadsheets\/d\/([\w-]+)/); if(!m)return null;
  const g=link.match(/[#?&]gid=(\d+)/);
  return 'https://docs.google.com/spreadsheets/d/'+m[1]+'/gviz/tq?tqx=out:csv&gid='+(g?g[1]:'0');
}
function sampleRows(){
  const w0=TODAY-((n2d(TODAY).getUTCDay()+6)%7)-7, r=(id,disc,area,grp,name,off,dur)=>({id:String(id),disc,area,grp,name,s:w0+off,dur});
  return [r(1,'CSA','Gedung A','Persiapan','Mobilisasi dan direksi keet',0,6),r(2,'CSA','Gedung A','Struktur','Galian dan pondasi',5,14),r(3,'CSA','Gedung A','Struktur','Kolom dan balok lantai 1',17,21),
    r(4,'CSA','Gedung A','Arsitektur','Pasangan dinding',33,18),r(5,'CSA','Gedung A','Arsitektur','Plester dan cat',47,16),r(6,'CSA','Gedung B','Baja','Fabrikasi rangka baja',7,21),
    r(7,'CSA','Gedung B','Baja','Erection rangka baja',28,14),r(8,'CSA','Gedung B','Atap','Pasang penutup atap',42,10),r(9,'MEP','Gedung A','Elektrikal','Instalasi cable tray',21,20),
    r(10,'MEP','Gedung A','Elektrikal','Pasang panel distribusi',45,5),r(11,'MEP','Gedung A','HVAC','Instalasi ducting',30,21),r(12,'MEP','Gedung B','Fire Protection','Instalasi pipa hydrant',24,24),
    r(13,'MEP','Gedung B','HVAC','Pasang unit VRF',52,7),r(14,'MEP','Gedung A','Commissioning','Test dan commissioning',60,7)];
}

/* ---------- state ---------- */
const K={cfg:'wc-cfg',data:'wc-data',st:'wc-state'};
let cfg={project:'',client:'',sheet:'',lead:8,w1:'',sync:'',laN:3,laPrep:2,laMode:'mulai',pgCatch:2,pdfLang:'both'}, rows=[], src='', marks={}, indent={}, vols={}, reals={}, HASB=false;
let T=[], TB={}, W1=0, BASEW=1, CUR=1, AREAS=[], DISCS=[];
let repFrom=0, repTo=0, laFrom=0, q='', prevView='dash', jump=null;
let view='dash', selW=1, areaF='', discF='', confirmClose=false, confirmReset=false, msg=null, busy=false, C=null;
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let stTs=0, syncMsg='', pushT=null;
const hm=()=>new Date().toTimeString().slice(0,5);
const saveState=()=>{stTs=Date.now();sv(K.st,{marks,indent,vols,reals,pa,pf,tg,ts:stTs});schedulePush()};
function schedulePush(){if(!cfg.sync)return;clearTimeout(pushT);pushT=setTimeout(push,1500)}
async function push(){
  try{const r=await fetch(cfg.sync,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({ts:stTs,marks,indent,vols,reals,pa,pf,tg})});
    const o=await r.json();if(!o.ok)throw 0;syncMsg='tersimpan ke Google Sheet '+hm()}
  catch(e){syncMsg='gagal simpan ke Google Sheet, data tetap ada di browser ini'}
  sub();
}
async function pull(manual){
  try{const r=await fetch(cfg.sync);const o=await r.json();
    if(o&&o.ts>stTs&&o.marks&&typeof o.marks==='object'){marks=o.marks;indent=o.indent||{};vols=o.vols||{};reals=o.reals||{};pa=o.pa||{};pf=o.pf||{};tg=o.tg||{};stTs=o.ts;sv(K.st,{marks,indent,vols,reals,pa,pf,tg,ts:stTs});syncMsg='data diambil dari Google Sheet '+hm()}
    else{syncMsg='terhubung ke Google Sheet';if(stTs&&!(o&&o.ts>=stTs))push()}
    if(manual)msg={lv:'ok',txt:'Terhubung. Tandaan dan barang indent sekarang ikut tersimpan ke Google Sheet.'}}
  catch(e){syncMsg='Google Sheet tidak terjangkau';if(manual)msg={lv:'crit',txt:'URL Apps Script tidak bisa dijangkau. Pastikan sudah di-deploy sebagai Web app dengan akses "Anyone".'}}
  render();
}
function sub(){$('h-sub').textContent=[cfg.client,T.length?T.length+' pekerjaan · '+wl(CUR)+' dari '+BASEW+' minggu':'belum ada jadwal',syncMsg].filter(Boolean).join(' · ')}
function build(){
  T=rows.map(r=>{const e=r.s+Math.max(r.dur,1)-1;return{...r,id:String(r.id),disc:normDisc(r.disc),e}});
  TB=Object.fromEntries(T.map(t=>[t.id,t])); AREAS=[...new Set(T.map(t=>t.area))]; DISCS=['CSA','MEP'].filter(d=>T.some(t=>t.disc===d));
  if(!T.length){W1=TODAY;BASEW=1;CUR=1;return}
  const mn=Math.min(...T.map(t=>t.s)), mx=Math.max(...T.map(t=>t.e));
  const c1=parseDate(cfg.w1); W1=c1!=null&&c1<=mx?c1:mn-((n2d(mn).getUTCDay()+6)%7);
  for(const t of T){t.ps=weekOf(t.s);t.pe=weekOf(t.e);const tot=t.e-t.s+1;t.sh=[];
    for(let w=t.ps;w<=t.pe;w++){const lo=w===t.ps?t.s:wkStart(w),hi=w===t.pe?t.e:wkEnd(w);t.sh.push((hi-lo+1)/tot)}}
  HASB=T.some(t=>t.bobot>0);
  BASEW=weekOf(mx); CUR=Math.min(Math.max(weekOf(TODAY),1),BASEW);
  if(!DISCS.includes(discF))discF=''; if(!AREAS.includes(areaF))areaF='';
}
const weekOf=n=>Math.max(1,Math.floor((n-W1)/7)+1), wkStart=w=>W1+7*(w-1), wkEnd=w=>W1+7*(w-1)+6;
function setData(r,source){repFrom=repTo=0;rows=r;src=source;sv(K.data,{rows,src});build();selW=CUR}

function compute(){
  const TF=discF?T.filter(t=>t.disc===discF):T;
  const byW={},base={};let maxW=BASEW,units=0,okU=0,missU=0,done=0,slipped=0,late=0,wt=0,wok=0,wplan=0;
  const ar={};
  for(const t of TF){
    const need=t.pe-t.ps+1;let ok=0,miss=0,nmiss=0,vsum=0,cp=0;
    const vv=vols[t.id]; t.vt=vv&&vv.v!=null?vv.v:(t.vol==null?null:t.vol); t.vu=vv&&vv.u?vv.u:(t.unit||''); const V=t.vt>0;
    for(let w=t.ps;w<=t.pe;w++)base[w]=(base[w]||0)+1;
    for(let w=t.ps;w<=t.pe+miss&&w<=BASEW+60;w++){
      let m=(marks[w]||{})[t.id]||'';const it={t,carry:w>t.pe};
      if(V){ /* target minggu ini = rencana kumulatif s/d minggu ini dikurangi realisasi sebelumnya */
        const r=(reals[w]||{})[t.id]; cp=w>=t.pe?t.vt:cp+t.vt*t.sh[w-t.ps];
        const tgt=Math.max(0,cp-vsum);let act=0;
        if(r!=null){act=r;m=act>=tgt-1e-9?'ok':'miss';it.part=m==='miss'&&act>0;it.rv=r}
        else if(m==='ok')act=tgt; else if(m===''&&tgt<=1e-9)m='ok';
        vsum+=act;it.tgt=tgt;it.act=act;
        if(m==='ok')ok++;else if(m==='miss'){nmiss++;if(w===t.pe+miss&&vsum<t.vt-1e-9)miss++}else if(w<CUR)late++;
      }else{if(m==='ok')ok++;else if(m==='miss'){miss++;nmiss++}else if(w<CUR)late++}
      it.m=m;(byW[w]||(byW[w]=[])).push(it);
    }
    t.ok=ok;t.miss=miss;t.need=need;t.vsum=vsum;t.done=V?vsum>=t.vt-1e-9:ok>=need;t.end=t.pe+miss;
    if(t.end>maxW)maxW=t.end;
    units+=need;okU+=ok;missU+=nmiss;if(t.done)done++;if(miss)slipped++;
    let cum=0,pl=0;for(let k=0;k<need;k++){if(k<ok)cum+=t.sh[k];if(t.ps+k<=CUR)pl+=t.sh[k]}
    if(V)cum=Math.min(1,vsum/t.vt);
    const tw=HASB?(t.bobot||0):need; t.cum=cum; t.pl=pl; wt+=tw; wok+=tw*cum; wplan+=tw*pl;
    const a=ar[t.area]||(ar[t.area]={n:0,done:0,u:0,ok:0,slip:0,w:0,wok:0});a.n++;a.u+=need;a.ok+=ok;a.w+=tw;a.wok+=tw*cum;if(t.done)a.done++;if(miss)a.slip++;
  }
  let planU=0;for(let w=1;w<=CUR;w++)planU+=base[w]||0;
  C={TF,byW,base,maxW,units,okU,missU,done,slipped,late,ar,planU,wt,wok,wplan};
}
function indAlert(it){
  if(it.status==='tiba')return{lv:'',txt:'Sudah tiba di lokasi',ok:true};
  const need=parseDate(it.need); if(need==null)return{lv:'',txt:'Tanggal butuh belum diisi'};
  if(it.status==='belum'){const ob=need-it.lead*7,d=ob-TODAY;
    if(d<0)return{lv:'crit',txt:'Terlambat pesan '+(-d)+' hari (batas '+fmt(ob)+')'};
    if(d<=14)return{lv:'warn',txt:'Pesan paling lambat '+fmt(ob)+' ('+d+' hari lagi)'};
    return{lv:'',txt:'Batas pesan '+fmt(ob)}}
  const d=need-TODAY;
  if(d<0)return{lv:'crit',txt:'Belum tiba, lewat '+(-d)+' hari dari kebutuhan'};
  if(d<=14)return{lv:'warn',txt:'Harus tiba dalam '+d+' hari'};
  return{lv:'',txt:'Sudah PO, dibutuhkan '+fmt(need)};
}
const indList=()=>Object.entries(indent).map(([id,it])=>({id,...it,al:indAlert(it),t:TB[it.task]}))
  .filter(i=>!discF||!i.t||i.t.disc===discF).sort((a,b)=>(a.need<b.need?-1:1));

function setMark(w,id,v){const m=marks[w]||(marks[w]={}),r=reals[w]||{},had=r[id]!=null;delete r[id];if(!had&&m[id]===v)delete m[id];else m[id]=v;saveState();render()}
function bulk(w,v){const m=marks[w]||(marks[w]={});for(const x of (C.byW[w]||[])){if(areaF&&x.t.area!==areaF)continue;if(x.m)continue;m[x.t.id]=v}saveState();render()}
function flag(tid){const id='t'+tid;if(indent[id])delete indent[id];else{const t=TB[tid];indent[id]={name:t.name,task:tid,lead:cfg.lead,need:n2iso(t.s),status:'belum'}}saveState();render()}
async function loadSheet(){
  const url=sheetCsvUrl(cfg.sheet||'');
  if(!url){msg={lv:'crit',txt:'Link Google Sheet tidak dikenali. Tempel link lengkap dari address bar.'};render();return}
  busy=true;msg=null;render();
  try{
    const urls=url.includes('/gviz/')?[url.replace('/gviz/tq?tqx=out:csv&','/export?format=csv&'),url+'&headers=1']:[url];
    let r=null,err=null;
    for(const u of urls){try{
      r=rowsFromCSV(await getCsv(u));break}catch(x){err=x}}
    if(!r){const m=(cfg.sheet||'').match(/\/spreadsheets\/d\/([\w-]+)/); if(m)try{r=await loadMapping(m[1])}catch(x){}}
    if(!r)throw err;
    setData(r.rows,'Google Sheet');
    msg={lv:'ok',txt:r.rows.length+' pekerjaan dimuat dari Google Sheet'+(r.tabs?' ('+r.tabs+' tab mingguan digabung)':'')+(r.skip?', '+r.skip+' baris dilewati karena nama atau tanggal mulai kosong':'')+'.'};
  }catch(e){msg={lv:'crit',txt:e.message==='Failed to fetch'?'Sheet tidak bisa dijangkau. Periksa koneksi dan pastikan sheet dibagikan ke "Siapa saja yang memiliki link".':e.message}}
  busy=false;render();
}

function chart(){
  const n=C.maxW,W=Math.max(720,n*26+60),H=230,L=34,B=26,top=10,ph=H-B-top;
  let mx=4;for(let w=1;w<=n;w++)mx=Math.max(mx,(C.byW[w]||[]).length,C.base[w]||0);
  const step=mx<=8?2:mx<=20?5:mx<=40?10:20; mx=Math.ceil(mx/step)*step; const bw=(W-L-8)/n,y=v=>top+ph-v/mx*ph;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Beban pekerjaan per minggu">';
  for(let v=0;v<=mx;v+=step)s+='<line x1="'+L+'" x2="'+(W-8)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>';
  for(let w=1;w<=n;w++){
    const it=C.byW[w]||[],ok=it.filter(x=>x.m==='ok').length,ms=it.filter(x=>x.m==='miss').length,rest=it.length-ok-ms;
    const x=L+(w-1)*bw+3,ww=bw-6;let yy=y(0);
    if(w===CUR)s+='<rect x="'+(x-3)+'" y="'+top+'" width="'+bw+'" height="'+ph+'" fill="var(--accent-soft)"/>';
    for(const [v,c] of [[ok,'var(--ok)'],[ms,'var(--crit)'],[rest,'var(--idle)']]){if(!v)continue;const h=v/mx*ph;yy-=h;s+='<rect x="'+x+'" y="'+yy+'" width="'+ww+'" height="'+h+'" fill="'+c+'"><title>'+wl(w)+': '+v+'</title></rect>'}
    const b=C.base[w]||0;if(b)s+='<line x1="'+(x-2)+'" x2="'+(x+ww+2)+'" y1="'+y(b)+'" y2="'+y(b)+'" stroke="var(--fg)" stroke-width="2"/>';
    s+='<text x="'+(x+ww/2)+'" y="'+(H-10)+'" text-anchor="middle"'+(w===CUR?' style="fill:var(--accent);font-weight:600"':'')+'>'+w+'</text>';
  }
  return s+'</svg>';
}

  h+='</tbody></table></div></div>';
  const vl=C.TF.filter(t=>t.vt>0&&t.cum<t.pl-1e-9).sort((a,b)=>(a.cum-a.pl)-(b.cum-b.pl));
  if(vl.length)h+='<div class="panel" style="margin-top:18px"><div class="panel-h"><h2>Volume terlambat ('+vl.length+')</h2><p>Hanya pekerjaan yang realisasinya di bawah rencana s/d '+wl(CUR)+', diurutkan dari yang paling tertinggal. Pekerjaan sesuai rencana tidak ditampilkan.</p></div><div class="scroll" style="max-height:420px;overflow-y:auto"><table><thead><tr><th>ID</th><th>Pekerjaan</th><th>Area</th><th class="num">Volume</th><th class="num">Rencana s/d '+wl(CUR)+'</th><th class="num">Realisasi</th><th class="num">Selisih</th><th>Progres</th></tr></thead><tbody>'
    +vl.map(t=>{const d=t.vt*(t.cum-t.pl);return '<tr><td>'+esc(t.id)+'</td><td>'+esc(t.name)+'</td><td>'+esc(t.area)+'</td><td class="num">'+nf(t.vt)+' '+esc(t.vu)+'</td><td class="num">'+nf(t.vt*t.pl)+'</td><td class="num">'+nf(t.vt*t.cum)+'</td><td class="num">'+(d<-1e-9?'<span class="pill crit">'+nf(d)+'</span>':nf(d))+'</td><td><div class="bar"><span style="width:'+pct(t.cum,1)+'%"></span></div></td></tr>'}).join('')+'</tbody></table></div></div>';

    +sl.map(t=>'<tr><td>'+esc(t.id)+'</td><td>'+esc(t.name)+'</td><td>'+esc(t.disc)+'</td><td>'+esc(t.area)+'</td><td class="num">+'+t.miss+' mgg</td><td>'+wl(t.end)+' (awal '+wl(t.pe)+')</td></tr>').join('')+'</tbody></table></div></div>';

function cellDn(v){
  if(v instanceof Date)return dn(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number')return v>30000&&v<80000?Math.round(v)-25569:null;
  if(typeof v==='string'){const m=v.match(/^Date\((\d+),(\d+),(\d+)/);return m?dn(+m[1],+m[2]+1,+m[3]):parseDate(v)}
  return null;

const MONRE=/\b(jan|feb|mar|apr|mei|may|jun|jul|agu|aug|agt|sep|okt|oct|nov|des|dec)/i;
function parsePG(g){
  const low=v=>String(v==null?'':v).trim().toLowerCase();
  let h=-1,col={};
  for(let i=0;i<Math.min(g.length,40)&&h<0;i++){const c={};
    (g[i]||[]).forEach((v,j)=>{const s=low(v);
      if(['item description','description','uraian','uraian pekerjaan'].includes(s))c.desc=j;
      else if(['weight','bobot','bobot (%)','weight (%)'].includes(s))c.w=j;
      else if(['item','no','no.'].includes(s)&&!('code' in c))c.code=j;
      else if(s==='area'||s==='lokasi')c.area=j;
      else if(s==='start'||s==='mulai')c.s=j;
      else if(s==='finish'||s==='selesai')c.f=j});
    if('desc' in c&&'w' in c){h=i;col=c}}
  if(h<0)throw new Error('Judul kolom "ITEM DESCRIPTION" dan "WEIGHT" tidak ditemukan. Pastikan file yang diunggah adalah Progress Control.');
  let dr=-1,wc=[];
  for(let i=h;i<Math.min(g.length,h+10)&&dr<0;i++){const js=[];
    (g[i]||[]).forEach((v,j)=>{if(j>col.w&&(v instanceof Date||(typeof v==='number'&&v>30000&&v<80000)))js.push(j)});
    if(js.length>=4){dr=i;wc=js}}
  if(dr<0)throw new Error('Baris tanggal minggu (di bawah judul WEEK) tidak ditemukan.');
  let nr=null,mr=null;
  for(let i=h;i<dr;i++){const r=g[i]||[];
    if(wc.filter(j=>Number.isInteger(r[j])).length>=4)nr=i;
    if(wc.filter(j=>typeof r[j]==='string'&&MONRE.test(r[j])).length>=2)mr=i}
  const weeks=wc.map(j=>({d:cellDn(g[dr][j]),n:nr!=null&&Number.isInteger(g[nr][j])?g[nr][j]:null,m:''}));

const BLNF=['JANUARI','FEBRUARI','MARET','APRIL','MEI','JUNI','JULI','AGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DESEMBER'];

  const same=x.getUTCMonth()===y.getUTCMonth()&&x.getUTCFullYear()===y.getUTCFullYear();

function pgCompute(){
  const NW=PG.weeks.length,cur=pgW,H=NW+40,its=PG.items.filter(it=>!discF||it.x===discF);
  const tot=its.reduce((s,it)=>s+it.w,0)||1;
  const ent={};for(const w in pa){const wi=+w;for(const k in pa[w])(ent[k]||(ent[k]=[])).push([wi,pa[w][k]])}
  for(const k in ent)ent[k].sort((a,b)=>a[0]-b[0]);
  const plan=Array(H).fill(0),act=Array(cur+1).fill(0),fcw=Array(H).fill(0);
  for(const it of its){
    for(let j=0;j<it.p.length;j++)plan[it.ps+j]+=it.p[j];
    const e=ent[it.k]||[];let prev=0,q=0;
    for(let i=0;i<=cur;i++){while(q<e.length&&e[q][0]<=i){prev=e[q][1];q++}act[i]+=it.w*prev/100}
    it.ac=prev;it.pc=0;for(let j=0;j<it.p.length&&it.ps+j<=cur;j++)it.pc+=it.p[j];it.pcp=it.w?Math.min(100,it.pc/it.w*100):0;
    it.own=pa[cur]&&pa[cur][it.k]!=null;
    const rem=it.w*Math.max(0,100-prev)/100;it.fe=null;
    if(rem>1e-12){const dist=[],fo=pf[it.k]?parseDate(pf[it.k]):null;
      if(fo!=null){const z=Math.max(cur+1,pgIdx(fo));for(let i=cur+1;i<=z&&i<H;i++)dist.push([i,1])}
      else{for(let j=0;j<it.p.length;j++){const i=it.ps+j;if(i>cur&&it.p[j]>0)dist.push([i,it.p[j]])}
        if(!dist.length)for(let i=cur+1;i<=cur+(+cfg.pgCatch||2)&&i<H;i++)dist.push([i,1])}
      const s=dist.reduce((a,b)=>a+b[1],0);for(const [i,x] of dist)fcw[i]+=rem*x/s;it.fe=dist.length?dist[dist.length-1][0]:null}
  }
  for(let i=cur;i>0;i--)act[i]-=act[i-1];

  for(let i=0;i<H;i++){a+=plan[i];pc.push(a/tot*100)}
  for(let i=0;i<=cur;i++){b+=act[i];ac.push(b/tot*100)}
  let f=b;for(let i=0;i<H;i++){if(i>cur)f+=fcw[i];fc.push(i<=cur?ac[i]:f/tot*100)}
  let lastP=0;for(let i=0;i<H;i++)if(plan[i]>1e-12)lastP=i;
  let fEnd=null;for(let i=0;i<H;i++)if(fc[i]>=99.995){fEnd=i;break}
  const HH=Math.min(H,Math.max(NW,(fEnd==null?H-1:fEnd)+1,lastP+1));
  P={its,tot,cur,plan:plan.map(x=>x/tot*100),act:act.map(x=>x/tot*100),fcw:fcw.map(x=>x/tot*100),pc,ac,fc,lastP,fEnd,HH};
}

  const agg=list=>{let W=0,f=0,pl=0,v=0;for(const it of list){W+=it.w;f+=it.w*(sol.floors.get(it)||0);pl+=it.w*tgAt(it,w);v+=it.w*(sol.map.get(it)||0)}return {W,f,pl,v}};
  const cells=(o,d)=>'<td class="num">'+pp3(o.W)+'</td><td class="num">'+pp(o.f/d)+'</td><td class="num plan-c">'+pp(o.pl/d)+'</td><td class="num">'+pp(o.v/d)+'</td><td class="num">'+nk((o.v-o.f)/d)+'</td><td class="num">'+sg((o.v-o.pl)/d)+'</td>';
  const lab={target:tr('semua item yang punya plan atau target','all items with plan or target'),naik:tr('hanya item yang naik','increasing items only'),filter:tr('sesuai filter layar','as filtered on screen')}[tgPI];
  let h='<h3 style="break-before:page">Target '+wl(sw.n)+' · '+fmtL(sw.d)+' – '+fmtL(sw.d+6)+'</h3><p class="note">'+tr('Plan kumulatif','Cumulative plan')+' '+pp(P.pc[w])+'% · Target '+pp(sol.T)+'% · '+tr('Selisih','Variance')+' '+sg(sol.T-P.pc[w])+'% · '+rows.length+' '+tr('item','items')+' ('+lab+')</p>';
  if(!rows.length)return h+'<p class="note">'+tr('Tidak ada item.','No items.')+'</p>';
  h+='<table class="tgp"><thead><tr><th>Item</th><th>'+th2('Uraian','Description')+'</th><th>Area</th><th class="num">'+th2('Bobot','Weight')+'</th><th class="num">'+th2('Posisi awal %','Start %')+'</th><th class="num plan-c">Plan %</th><th class="num">Target %</th><th class="num">'+th2('Naik','Increase')+'</th><th class="num">'+th2('Selisih %','Variance %')+'</th></tr></thead><tbody>';
  const byBill={};for(const it of P.its)(byBill[it.b]||(byBill[it.b]=[])).push(it);
  let lb=null,ls=null;
  for(const r of rows){const it=r.it;
    if(it.b!==lb){const o=agg(byBill[it.b]);h+='<tr class="tgb"><td colspan="3">'+esc(it.b)+'</td>'+cells(o,o.W||1)+'</tr>';lb=it.b;ls=null}
    if(it.s!==ls&&it.s){h+='<tr><td colspan="9"><i>'+esc(it.s)+'</i></td></tr>';ls=it.s}
    h+='<tr><td>'+esc(it.c)+'</td><td>'+esc(it.d)+(it.u?' <small style="color:var(--muted)">('+esc(it.u)+')</small>':'')+'</td><td>'+esc(it.a)+'</td><td class="num">'+pp3(it.w)+'</td><td class="num">'+pp(r.f)+'</td><td class="num plan-c">'+pp(r.pl)+'</td><td class="num">'+pp(r.v)+'</td><td class="num">'+nk(r.v-r.f)+'</td><td class="num">'+sg(r.x)+'</td></tr>'}
  const o=agg(P.its);
  return h+'<tr class="tgb"><td colspan="3">TOTAL</td>'+cells(o,P.tot)+'</tr></tbody></table><p class="note">'+tr('Baris bill dan TOTAL menunjukkan progress terbobot seluruh item di bill atau proyek, termasuk item yang tidak tampil.','Bill and TOTAL rows show the weighted progress of all items in the bill or project, including items not listed.')+'</p>';
}
function tgPrint(){if(tgPS==='all'){const A=tgAnch().filter(w=>w>P.cur);if(A.length)return A.map(w=>tgPrintWeek(w,tgSolve(w))).join('')}
  return TGS&&TGS.T!=null?tgPrintWeek(tgSel,TGS):''}
function tgPickWeek(){if(tgSel==null||tgSel>=PG.weeks.length){const nx=tgAnch().find(w=>w>P.cur);tgSel=nx!=null?nx:Math.min(P.cur+1,PG.weeks.length-1)}}
function vTg(){
  if(!PG)return '<div class="panel">'+(pgMsg?'<div class="alert '+pgMsg.lv+'">'+esc(pgMsg.txt)+'</div>':'')+'<h2>Belum ada data Progress Control</h2><p class="note">Halaman Target memakai bobot dan rencana dari file Progress Control.</p><div class="btnrow"><button class="primary" id="pg-up">Unggah Progress Control (.xlsx)</button></div></div>';
  if(pgW==null)pgW=pgCur();pgW=Math.min(Math.max(pgW,0),PG.weeks.length-1);pgCompute();tgBuildEnt();tgPickWeek();TGS=tgSolve(tgSel);
  let opt='';for(let i=0;i<PG.weeks.length;i++){const w=pgWk(i);opt+='<option value="'+i+'"'+(i===pgW?' selected':'')+'>'+wl(w.n)+' · '+fmt(w.d)+(i===pgCur()?' (minggu ini)':'')+'</option>'}
  return '<div class="panel no-print"><div class="btnrow"><label>Aktual sampai minggu<select id="pg-w">'+opt+'</select></label><p class="note" style="flex:1;min-width:220px">Target disimpan terpisah untuk Semua, CSA, dan MEP sesuai filter disiplin di atas.</p></div></div>'
   +'<div class="panel" style="margin-top:18px" id="tg-sum">'+tgSum()+'</div><div id="tg-weeks" class="no-print" style="margin-top:18px">'+tgWeeks()+'</div><div id="tg-list" class="no-print" style="margin-top:18px">'+tgList()+'</div><div id="tg-pbox" class="print-only"></div>';

function tgRefreshWeeks(){TGS=tgSolve(tgSel);$('tg-sum').innerHTML=tgSum();const S=tgScope();
  for(let i=0;i<PG.weeks.length;i++){const v=tgCurve(i),a=$('tgw-'+i),d=$('tgd-'+i),s=$('tgs-'+i);if(a)a.placeholder=v!=null?pp(v):'';if(d)d.textContent=v!=null?pp(v-P.pc[i]):'';if(s)s.innerHTML=tgStatus(i)}
  $('tg-list').innerHTML=tgList()}
function tgRefreshItems(){TGS=tgSolve(tgSel);$('tg-sum').innerHTML=tgSum();let sum=0;
  for(const r of tgRows(TGS)){sum+=r.c;const k=r.it.k,a=$('tgi-'+k),n=$('tgn-'+k),c=$('tgc-'+k);const xc=$('tgx-'+k);if(xc)xc.innerHTML=sg(r.v-tgAt(r.it,tgSel));if(a)a.placeholder=pp(r.v);if(n)n.innerHTML=nk(r.d);if(c)c.textContent=pp(r.c)}
  const e=$('tg-sumc');if(e)e.textContent=pp(sum)+'%'}

   +'<div class="btnrow"><button class="primary" id="s-load"'+(busy?' disabled':'')+'>'+(busy?'Memuat…':'Muat dari Google Sheet')+'</button><button id="s-csv">Unggah file CSV</button><button id="s-sample">Muat data contoh</button></div>'

   +'<p class="note">Tandaan tercapai/geser mengikuti <code>ID</code> pekerjaan, jadi ID jangan diubah setelah mulai dipakai.</p></div>';
  h+='<div class="panel" style="margin-top:18px"><div class="panel-h"><h2>Simpan ke Google Sheet</h2><p>'+(cfg.sync?esc(syncMsg||'URL terpasang'):'Belum dihubungkan: tandaan hanya ada di browser ini.')+'</p></div>'
   +'<div class="form"><label class="wide">URL Web app Apps Script<input id="c-sync" data-cfg="sync" value="'+esc(cfg.sync)+'" placeholder="https://script.google.com/macros/s/…/exec"></label></div>'

   +'<p class="note">Cara pasang: buka Google Sheet jadwal, menu Extensions &gt; Apps Script, tempel isi file <code>apps-script/Code.gs</code> dari repo ini, lalu Deploy &gt; New deployment &gt; Web app dengan "Execute as: Me" dan "Who has access: Anyone". Tempel URL yang berakhiran <code>/exec</code> di atas. Data disimpan di tab <code>KontrolData</code> pada sheet yang sama. Siapa pun yang memegang URL ini bisa membaca dan menimpa tandaan, jadi jangan dibagikan sembarangan.</p></div>';
  h+='<div class="panel" style="margin-top:18px"><div class="panel-h"><h2>Cadangan data</h2><p>Ekspor tandaan mingguan dan barang indent ke file, atau impor dari file cadangan.</p></div>'
   +'<div class="btnrow"><button id="s-export">Ekspor tandaan (.json)</button><button id="s-import">Impor tandaan</button><span class="spacer"></span>'
   +(confirmReset?'<span>Hapus semua tandaan dan barang indent?</span><button id="s-reset-yes" class="b-miss" aria-pressed="true">Ya, hapus</button><button id="s-reset-no">Batal</button>':'<button id="s-reset">Hapus semua tandaan</button>')+'</div></div>';

function render(){
  compute(); selW=Math.min(Math.max(selW,1),C.maxW);
  const dc=$('d-cand'),wasOpen=dc&&dc.open;
  $('v-dash').innerHTML=view==='dash'?vDash():''; $('v-week').innerHTML=view==='week'?vWeek():'';
  $('v-ind').innerHTML=view==='ind'?vInd():''; $('v-set').innerHTML=view==='set'?vSet():''; $('v-rep').innerHTML=view==='rep'?vRep():''; $('v-la').innerHTML=view==='la'?vLa():''; $('v-pg').innerHTML=view==='pg'?vPg():''; $('v-tg').innerHTML=view==='tg'?vTg():''; $('v-cari').innerHTML=view==='cari'?vCari():'';
  if(wasOpen&&$('d-cand'))$('d-cand').open=true;
  for(const v of ['dash','week','la','pg','tg','ind','rep','set','cari']){$('v-'+v).hidden=view!==v;const tb=$('tab-'+v);if(tb)tb.setAttribute('aria-selected',view===v)}
  if(jump){const r=$('row-'+jump);if(r&&r.scrollIntoView){r.scrollIntoView({block:'center'});r.classList.add('flash')}jump=null}
  const n=indList().filter(i=>i.al.lv).length,b=$('ind-n');b.hidden=!n;b.textContent=n;
  $('h-title').textContent=cfg.project||'Kontrol Mingguan';
  sub();
  document.title=cfg.project?cfg.project+' · Kontrol Mingguan':'Kontrol Mingguan';
  const dsrc=(view==='pg'||view==='tg')&&PG?PG.items.map(i=>i.x):T.map(t=>t.disc),dl=['CSA','MEP'].filter(d=>dsrc.includes(d));
  const show=dl.length>0&&view!=='set'; $('discbar').hidden=!show;
  if(show){const c={};for(const x of dsrc)c[x]=(c[x]||0)+1;
    $('discchips').innerHTML='<span class="lab">Disiplin</span><button class="chip" data-disc="" aria-pressed="'+(!discF)+'">Semua ('+dsrc.length+')</button>'+dl.map(d=>'<button class="chip" data-disc="'+esc(d)+'" aria-pressed="'+(discF===d)+'">'+esc(d)+' ('+c[d]+')</button>').join('')}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.view){view=d.view;confirmClose=confirmReset=false;render();return}
  if(d.tgw!=null){tgSel=+d.tgw;render();return}
  if(d.goto){selW=+d.gw;areaF='';view='week';jump=d.goto;render();return}
  if('disc' in d){discF=d.disc;areaF='';render();return}
  if('area' in d){areaF=d.area;render();return}
  if(d.ok){setMark(selW,d.ok,'ok');return}
  if(d.miss){setMark(selW,d.miss,'miss');return}
  if(d.flag){flag(d.flag);return}
  if(d.del){delete indent[d.del];saveState();render();return}
  switch(b.id){
    case 'w-prev':selW--;confirmClose=false;break;case 'w-next':selW++;confirmClose=false;break;case 'w-cur':selW=CUR;break;
    case 'w-allok':bulk(selW,'ok');return;
    case 'w-close':confirmClose=true;break;case 'w-close-no':confirmClose=false;break;
    case 'w-close-yes':confirmClose=false;bulk(selW,'miss');return;
    case 'ind-add':indent['m'+Date.now().toString(36)]={name:'Barang baru',task:'',lead:cfg.lead,need:n2iso(TODAY+cfg.lead*7),status:'belum'};saveState();break;
    case 's-load':loadSheet();return;
    case 's-sync':pull(true);return;
    case 'r-print':case 'la-print':case 'pg-print':window.print();return;
    case 'pg-up':$('f-xlsx').click();return;
    case 'tg-print':{LG=cfg.pdfLang||'both';NL=LG==='en'?'en-US':'id-ID';$('tg-sum').innerHTML=tgSum();$('tg-pbox').innerHTML=tgPrint();LG='id';NL='id-ID';window.print();$('tg-sum').innerHTML=tgSum();return}
    case 'tg-clear':tgClear=true;break;case 'tg-clear-no':tgClear=false;break;
    case 'tg-clear-yes':tg[discF||'all']={a:{},o:{}};tgClear=false;saveState();break;
    case 'pg-bulk':{const v=num(($('pg-bulkv')||{}).value);if(v==null)return;pgBulk=Math.max(0,Math.min(100,v));break}
    case 'pg-bulk-no':pgBulk=null;break;
    case 'pg-bulk-yes':{const m=pa[pgW]||(pa[pgW]={});for(const it of pgList())m[it.k]=pgBulk;pgBulk=null;saveState();break}
    case 'q-clear':q='';$('q').value='';view=prevView;break;
    case 's-csv':$('f-csv').click();return;
    case 's-import':$('f-json').click();return;
    case 's-sample':setData(sampleRows(),'data contoh');msg={lv:'warn',txt:'Data contoh dimuat. Ini bukan jadwal Anda; ganti dengan Google Sheet atau CSV sendiri.'};view=view==='set'?'set':'dash';break;
    case 's-export':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({cfg:{project:cfg.project,client:cfg.client,lead:cfg.lead},marks,indent,vols,reals,pa,pf,tg},null,1)],{type:'application/json'}));a.download='kontrol-mingguan-tandaan.json';a.click();return}
    case 's-reset':confirmReset=true;break;case 's-reset-no':confirmReset=false;break;
    case 's-reset-yes':confirmReset=false;marks={};indent={};reals={};saveState();msg={lv:'ok',txt:'Semua tandaan dan barang indent dihapus.'};break;
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='w-sel'){selW=+el.value;confirmClose=false;render();return}
  if(el.id==='f-xlsx'&&el.files[0]){const f=el.files[0];el.value='';pgLoadFile(f);return}
  if(el.dataset.tga!=null){const w=+el.dataset.tga,v=num(el.value),S=tgScope();if(v==null)delete S.a[w];else S.a[w]=Math.max(0,Math.min(100,v));saveState();tgRefreshWeeks();return}
  if(el.dataset.tgo!=null){const k=el.dataset.tgo,v=num(el.value),S=tgScope(),o=S.o[tgSel]||(S.o[tgSel]={});if(v==null)delete o[k];else o[k]=Math.max(0,Math.min(100,v));saveState();tgRefreshItems();return}
  if(el.id==='tg-q'){tgQ=el.value;render();return}
  if(el.id==='tg-bill'){tgBill=el.value;render();return}
  if(el.id==='tg-area'){tgArea=el.value;render();return}
  if(el.id==='tg-all'){tgAll=el.checked;render();return}
  if(el.id==='tg-ps'){tgPS=el.value;return}
  if(el.id==='tg-pi'){tgPI=el.value;return}
  if(el.id==='tg-lang'){cfg.pdfLang=el.value;sv(K.cfg,cfg);return}
  if(el.id==='pg-w'){pgW=+el.value;pgBulk=null;render();return}
  if(el.id==='pg-catch'){cfg.pgCatch=+el.value;sv(K.cfg,cfg);render();return}
  if(el.id==='pg-q'){pgQ=el.value;render();return}
  if(el.id==='pg-bill'){pgBill=el.value;render();return}
  if(el.id==='pg-area'){pgArea=el.value;render();return}
  if(el.id==='pg-only'){pgOnly=el.checked;render();return}
  if(el.dataset.pa!=null){const k=el.dataset.pa,v=num(el.value),m=pa[pgW]||(pa[pgW]={});if(v==null)delete m[k];else m[k]=Math.max(0,Math.min(100,v));saveState();pgRefresh(k);return}
  if(el.dataset.pf!=null){const k=el.dataset.pf;if(el.value)pf[k]=el.value;else delete pf[k];saveState();pgRefresh(k);return}
  if(el.id==='la-from'){laFrom=+el.value;render();return}
  if(el.id==='la-n'||el.id==='la-prep'||el.id==='la-mode'){const k={'la-n':'laN','la-prep':'laPrep','la-mode':'laMode'}[el.id];cfg[k]=k==='laMode'?el.value:+el.value;sv(K.cfg,cfg);render();return}
  if(el.id==='r-from'){repFrom=+el.value;if(repTo<repFrom)repTo=repFrom;render();return}
  if(el.id==='r-to'){repTo=+el.value;if(repTo<repFrom)repFrom=repTo;render();return}
  if(el.id==='f-csv'&&el.files[0]){const f=el.files[0];readFile(f,t=>{try{const r=rowsFromCSV(t);setData(r.rows,'file '+f.name);msg={lv:'ok',txt:r.rows.length+' pekerjaan dimuat dari '+f.name+(r.skip?', '+r.skip+' baris dilewati':'')+'.'}}catch(x){msg={lv:'crit',txt:x.message}}el.value='';render()});return}
  if(el.id==='f-json'&&el.files[0]){readFile(el.files[0],t=>{try{const o=JSON.parse(t);if(typeof o.marks!=='object'||typeof o.indent!=='object')throw 0;marks=o.marks||{};indent=o.indent||{};vols=o.vols||{};reals=o.reals||{};pa=o.pa||{};pf=o.pf||{};tg=o.tg||{};saveState();msg={lv:'ok',txt:'Tandaan berhasil diimpor.'}}catch(x){msg={lv:'crit',txt:'File bukan cadangan tandaan yang valid.'}}el.value='';render()});return}
  if(el.dataset.cfg){const k=el.dataset.cfg;cfg[k]=k==='lead'?Math.max(0,Math.min(80,Math.round(+el.value||0))):el.value.trim();sv(K.cfg,cfg);if(k==='w1'){build();selW=CUR}render();return}
  if(el.dataset.real!=null){const k=el.dataset.real,v=num(el.value),r=reals[selW]||(reals[selW]={});
    if(v==null)delete r[k];else{r[k]=Math.max(0,v);if(marks[selW])delete marks[selW][k]}saveState();render();return}
  if(el.dataset.vol!=null||el.dataset.volu!=null){const k=el.dataset.vol!=null?el.dataset.vol:el.dataset.volu,o=vols[k]||(vols[k]={v:null,u:''});
    if(el.dataset.vol!=null)o.v=num(el.value);else o.u=el.value.trim();
    if(o.v==null&&!o.u)delete vols[k];saveState();render();return}
  const id=el.dataset.ind;if(!id||!indent[id])return;const f=el.dataset.f;
  if(f==='lead')indent[id].lead=Math.max(0,Math.min(80,Math.round(+el.value||0)));
  else if(f==='need'){if(!el.value)return;indent[id].need=el.value}
  else indent[id][f]=el.value;
  saveState();render();
});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;q=e.target.value;
  if(q.trim()){if(view!=='cari')prevView=view;view='cari'}else if(view==='cari')view=prevView;render()});
document.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Escape'&&q){q='';e.target.value='';view=prevView;render()}});
cfg={...cfg,...ld(K.cfg,{})}; {const d=ld(K.data,null);if(d&&Array.isArray(d.rows)){rows=d.rows;src=d.src||''}} {const s=ld(K.st,{});marks=s.marks||{};indent=s.indent||{};vols=s.vols||{};reals=s.reals||{};pa=s.pa||{};pf=s.pf||{};tg=s.tg||{};stTs=s.ts||0}
PG=ld(KP,null); build(); selW=CUR; if(!T.length&&!PG)view='set'; render(); if(cfg.sync)pull();
